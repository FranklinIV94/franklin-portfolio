<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Lab — Anime.js</title><meta name="robots" content="noindex">
<style>
:root{--accent:#c8ff57;--ink:#e2e4ea;--muted:#9d9dab;--bg:#0d0e13;--surface:#111116;--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-rows:1fr auto;height:100%}
.stage{position:relative;min-height:0;overflow:hidden;outline:none}
.stage canvas{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);flex-wrap:wrap}
.bar .readout{margin-left:auto;white-space:nowrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}
button[aria-pressed=true],button:hover{border-color:var(--accent);color:var(--accent)}
input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.lanes{display:flex;flex-direction:column;justify-content:center;gap:0;height:100%;padding:16px 18px}
.lane{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:12px;min-height:0;flex:1}
.lane .name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.rail{position:relative;height:1px;background:rgba(255,255,255,.12)}
.dot{position:absolute;top:-6px;left:0;width:13px;height:13px;border-radius:50%;background:var(--ink)}
.lane:nth-child(2) .dot{background:var(--accent)}

</style></head><body>
<div class="app">
<div class="stage"><div class="lanes" id="lanes"></div></div>
<div class="bar"><button id="play" type="button" aria-pressed="true">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub the timeline"><span class="readout" id="readout">0.00 s</span></div>
</div>
<script src="./vendor/timeline.js"></script>
</body></html>
