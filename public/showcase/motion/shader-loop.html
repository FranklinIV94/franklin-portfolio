<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shader Loop — GLSL</title><meta name="robots" content="noindex">
<style>
:root{--accent:#c8ff57;--ink:#e2e4ea;--muted:#9d9dab;--bg:#0d0e13;--surface:#111116;--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-rows:1fr auto;height:100%}
.stage{position:relative;min-height:0;overflow:hidden;outline:none}
.stage canvas{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);flex-wrap:wrap}
.bar .readout{margin-left:auto;white-space:nowrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}
button[aria-pressed=true],button:hover{border-color:var(--accent);color:var(--accent)}
input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{grid-template-rows:1fr auto}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:0;height:100%}
.split .stage{min-height:0}
textarea{width:100%;height:100%;resize:none;border:0;border-left:1px solid var(--border);background:#0a0b0f;color:var(--ink);font:11.5px/1.5 'JetBrains Mono',ui-monospace,monospace;padding:12px;tab-size:2;outline:none}
textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
#status{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
#status.ok{color:#7bd88f}#status.err{color:#ff6b6b}
@media(max-width:560px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}textarea{border-left:0;border-top:1px solid var(--border)}}

</style></head><body>
<div class="app">
<div class="split"><div class="stage"><canvas id="stage" aria-label="The output of the fragment shader in the editor" role="img"></canvas></div>
<textarea id="src" spellcheck="false" aria-label="Fragment shader source (GLSL). Ctrl+Enter applies.">void main(){
  vec2 uv = (gl_FragCoord.xy * 2. - resolution) / resolution.y;
  float t = time * .5;
  float k = sin(uv.x * 3. + t) + sin(uv.y * 2.3 - t * .7)
          + sin((uv.x + uv.y) * 2. + t * .5)
          + sin(length(uv) * 4. - t * 1.3);
  float n = (k + 4.) / 8.;
  vec3 col = vec3(.04 + n * n * .75, .04 + n * .96, .06 + (1. - n) * .25);
  gl_FragColor = vec4(col, 1.);
}</textarea></div>
<div class="bar"><button id="apply" type="button">Apply · Ctrl+Enter</button><button id="reset" type="button">Reset</button><span id="status"></span></div>
</div>
<script src="./vendor/shader.js"></script>
</body></html>
