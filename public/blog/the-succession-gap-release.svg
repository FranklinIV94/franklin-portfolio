<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Four-step timeline of the NVIDIA release: thirty-three years of one person as the control, then a morning resignation effective immediately with no cause given, then the CFO installed as interim CEO while keeping the CFO job, then the first Chair of the Board in company history. A bar across the bottom notes what the release did not contain: a cause, a successor, or a timeline.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161a20" stroke-width="1"/>
    </pattern>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2f38"/>
      <stop offset="62%" stop-color="#2c2f38"/>
      <stop offset="100%" stop-color="#c8ff57"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0b0f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <style>
    .eyebrow { font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; letter-spacing: 3px; fill: #c8ff57; }
    .date    { font-family: 'DejaVu Sans Mono', monospace; font-size: 19px; letter-spacing: 2px; fill: #8a8f9c; }
    .h       { font-family: 'Inter', 'DejaVu Sans', sans-serif; font-size: 31px; font-weight: 600; fill: #f4f6f0; }
    .b       { font-family: 'Inter', 'DejaVu Sans', sans-serif; font-size: 20px; fill: #9aa0ad; }
    .bw      { font-family: 'Inter', 'DejaVu Sans', sans-serif; font-size: 20px; fill: #d7dbe2; }
    .num     { font-family: 'Inter', 'DejaVu Sans', sans-serif; font-size: 26px; font-weight: 600; fill: #c8ff57; }
    .foot    { font-family: 'Inter', 'DejaVu Sans', sans-serif; font-size: 19px; fill: #7e8494; }
    .footb   { font-family: 'DejaVu Sans Mono', monospace; font-size: 19px; letter-spacing: 2px; fill: #c8ff57; }
  </style>

  <text x="80" y="88" class="eyebrow">NVIDIA · 12 NOVEMBER 2026 · THE BOARD RELEASE</text>

  <g transform="translate(0,-58)">
  <!-- spine -->
  <line x1="200" y1="330" x2="1400" y2="330" stroke="url(#spine)" stroke-width="3"/>
  <g fill="#0a0b0f" stroke="#2c2f38" stroke-width="2">
    <circle cx="200" cy="330" r="11"/>
    <circle cx="600" cy="330" r="11"/>
    <circle cx="1000" cy="330" r="11"/>
  </g>
  <circle cx="1400" cy="330" r="13" fill="#c8ff57"/>

  <!-- step 1 -->
  <text x="200" y="272" class="date" text-anchor="middle">1993 — 2026</text>
  <rect x="40" y="380" width="320" height="196" rx="16" fill="#111116" stroke="#24262e" stroke-width="1.5"/>
  <text x="72" y="428" class="num">33 years</text>
  <text x="72" y="470" class="b">One person is the</text>
  <text x="72" y="498" class="b">control. That is the</text>
  <text x="72" y="526" class="b">whole governance</text>
  <text x="72" y="554" class="b">model, in one line.</text>

  <!-- step 2 -->
  <text x="600" y="272" class="date" text-anchor="middle">MORNING</text>
  <rect x="440" y="380" width="320" height="196" rx="16" fill="#111116" stroke="#24262e" stroke-width="1.5"/>
  <text x="472" y="428" class="h">Resignation</text>
  <text x="472" y="470" class="bw">Effective immediately.</text>
  <text x="472" y="498" class="b">President, CEO and</text>
  <text x="472" y="526" class="b">board member. No cause</text>
  <text x="472" y="554" class="b">given. None.</text>

  <!-- step 3 -->
  <text x="1000" y="272" class="date" text-anchor="middle">SAME AFTERNOON</text>
  <rect x="840" y="380" width="320" height="196" rx="16" fill="#111116" stroke="#24262e" stroke-width="1.5"/>
  <text x="872" y="428" class="h">Interim, twice</text>
  <text x="872" y="470" class="bw">Colette Kress</text>
  <text x="872" y="498" class="b">Interim CEO — and still</text>
  <text x="872" y="526" class="b">CFO. Two full-time</text>
  <text x="872" y="554" class="b">jobs, one signature.</text>

  <!-- step 4 -->
  <text x="1400" y="272" class="date" text-anchor="middle">SAME AFTERNOON</text>
  <rect x="1240" y="380" width="320" height="196" rx="16" fill="#111116" stroke="#c8ff57" stroke-width="1.5"/>
  <text x="1272" y="428" class="h">First chair</text>
  <text x="1272" y="470" class="bw">Harvey C. Jones</text>
  <text x="1272" y="498" class="b">First Chair of the Board</text>
  <text x="1272" y="526" class="b">in company history. A</text>
  <text x="1272" y="554" class="b">control, installed.</text>

  </g>

  <!-- absence bar -->
  <rect x="40" y="648" width="1520" height="104" rx="16" fill="#0d1210" stroke="#c8ff57" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="80" y="694" class="footb">NOT IN THE RELEASE</text>
  <text x="80" y="728" class="foot">No cause · no named successor · no timeline. A search, starting now, internal and external.</text>

  <text x="80" y="822" class="foot">Source: NVIDIA Newsroom, “NVIDIA Announces CEO Transition,” 12 November 2026.</text>
</svg>
